<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <script src="api-override.js?v=1"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping Cart — OZEL CAFE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Tajawal:wght@300;400;500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css?v=1"/>
  <style>
    /* Custom styles for cart page */
    .cart-page {
      padding: 120px 2rem 5rem;
      max-width: 800px;
      margin: 0 auto;
      min-height: 80vh;
    }
    .cart-header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .cart-header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }
    .cart-items-list {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .cart-item-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-item-row:last-child {
      border-bottom: none;
    }
    .ci-details h4 {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 0.2rem;
    }
    .ci-details p {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .ci-price {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      color: var(--gold);
    }
    .ci-remove-btn {
      background: transparent;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 1.2rem;
      margin-left: 1rem;
    }
    .cart-summary {
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 1.5rem;
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1rem;
      font-size: 1rem;
      color: var(--text);
    }
    .summary-row.total {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--gold);
      border-top: 1px solid var(--line);
      padding-top: 1rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .form-group input, .form-group textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--line);
      color: var(--text);
      padding: 0.8rem;
      font-family: 'Tajawal', sans-serif;
      border-radius: 4px;
    }
    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--gold);
      outline: none;
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="nav" class="scrolled">
  <div class="nav-logo">
    <a href="index.html"><img src="imgs/Ozel-Logo--01.png" alt="OZEL CAFE Logo" class="nav-logo-img" /></a>
  </div>
  <div class="nav-links">
    <a href="index.html#about" data-en="Story" data-ar="حكايتنا">Story</a>
    <a href="index.html#lounge" data-en="Lounge" data-ar="ركن التسلية">Lounge</a>
    <a href="index.html#menu" data-en="Menu" data-ar="المنيو">Menu</a>
    <a href="index.html#contact" data-en="Contact" data-ar="تواصل معنا">Contact</a>
  </div>
  <div class="nav-right-sec" style="display:flex;gap:1.5rem;align-items:center">
    <div class="lang-switch-wrapper" onclick="toggleLanguage()" id="langToggleSwitch">
      <span class="lang-switch-text en-text">EN</span>
      <div class="lang-switch-pill">
        <div class="lang-switch-thumb"></div>
      </div>
      <span class="lang-switch-text ar-text">ع</span>
    </div>
    <div id="nav-user-area">
      <a href="login.html" class="nav-user-btn">
        <span data-en="Login" data-ar="تسجيل الدخول">Login</span>
      </a>
    </div>
    <button class="nav-cta" onclick="location.href='index.html#menu'" data-en="Order Now" data-ar="اطلب الآن">Order Now</button>
  </div>
  <!-- Hamburger Button (Mobile Only) -->
  <button class="nav-hamburger" id="navHamburger" aria-label="Menu" onclick="toggleMobileMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>
</nav>

<!-- MOBILE DRAWER MENU -->
<div class="mobile-drawer" id="mobileDrawer">
  <div class="drawer-overlay" onclick="toggleMobileMenu()"></div>
  <div class="drawer-content">
      <div class="drawer-header">
        <a href="index.html"><img src="imgs/Ozel-Logo--01.png" alt="OZEL Logo" class="drawer-logo" /></a>
        <button class="drawer-close" onclick="toggleMobileMenu()">✕</button>
      </div>
    <div class="drawer-links">
        <a href="index.html#about" onclick="toggleMobileMenu()" data-en="Story" data-ar="حكايتنا">Story</a>
        <a href="index.html#lounge" onclick="toggleMobileMenu()" data-en="Lounge" data-ar="ركن التسلية">Lounge</a>
        <a href="index.html#menu" onclick="toggleMobileMenu()" data-en="Menu" data-ar="المنيو">Menu</a>
        <a href="index.html#contact" onclick="toggleMobileMenu()" data-en="Contact" data-ar="تواصل معنا">Contact</a>
      </div>
    <div class="drawer-divider"></div>
    <div class="drawer-footer">
      <!-- Language Switcher in Drawer -->
      <div class="drawer-lang-wrapper">
        <span style="font-size:0.75rem; color:var(--muted);" data-en="Language" data-ar="اللغة">Language</span>
        <div class="lang-switch-wrapper" onclick="toggleLanguage()">
          <span class="lang-switch-text en-text">EN</span>
          <div class="lang-switch-pill">
            <div class="lang-switch-thumb"></div>
          </div>
          <span class="lang-switch-text ar-text">ع</span>
        </div>
      </div>
      
      <!-- User Area in Drawer -->
      <div id="drawer-user-area"></div>
      
      <!-- Order Now CTA in Drawer -->
      <button class="drawer-cta" onclick="toggleMobileMenu(); location.href='index.html#menu'" data-en="Order Now ✦" data-ar="اطلب الآن ✦">Order Now ✦</button>
    </div>
  </div>
</div>

<div class="cart-page">
  <div class="cart-header">
    <h1 data-en="Your Shopping Cart" data-ar="سلة مشترياتك">Your Shopping Cart</h1>
    <p style="color:var(--muted)" data-en="Review your orders before confirmation" data-ar="راجع طلباتك قبل التأكيد">Review your orders before confirmation</p>
  </div>

  <div id="emptyCartMsg" style="display:none; text-align:center; padding:3rem; color:var(--muted);">
    <p style="font-size:1.2rem; margin-bottom:1.5rem;" data-en="Your cart is currently empty" data-ar="سلة مشترياتك فارغة حالياً">Your cart is currently empty</p>
    <a href="index.html#menu" class="btn-gold" style="display:inline-flex; text-decoration:none;" data-en="Browse Menu" data-ar="تصفح المنيو">Browse Menu</a>
  </div>

  <div id="cartContentArea">
    <div class="cart-items-list" id="cartItemsList">
      <!-- Items will be loaded here -->
    </div>

    <div class="cart-summary">
      <div class="form-group">
        <label data-en="Table Number" data-ar="رقم الطاولة">Table Number</label>
        <input type="number" id="tableNum" data-placeholder-en="Enter your table number" data-placeholder-ar="أدخل رقم طاولتك" placeholder="Enter your table number"/>
      </div>
      
      <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:1.5rem;">
        <input type="checkbox" id="isTakeaway" style="width:auto; cursor:pointer;" onchange="handleTakeawayToggle(this)"/>
        <label for="isTakeaway" style="margin-bottom:0; cursor:pointer; font-size:.8rem; color:var(--muted); letter-spacing:.1em;" data-en="Takeaway order" data-ar="طلب سفري (تيك أواي)">Takeaway order</label>
      </div>

      <div class="form-group" id="takeawayPhoneGroup" style="display:none;">
        <label data-en="Phone Number (required)" data-ar="رقم الهاتف (مطلوب)">Phone Number</label>
        <input type="tel" id="takeawayPhone" data-placeholder-en="e.g. 01000000000" data-placeholder-ar="مثال ٠١٠٠٠٠٠٠٠٠٠" placeholder="e.g. 01000000000"/>
      </div>

      <div class="form-group">
        <label data-en="Special Notes" data-ar="ملاحظات خاصة">Special Notes</label>
        <textarea id="orderNotes" data-placeholder-en="Write any special requests here..." data-placeholder-ar="اكتب أي طلبات خاصة هنا..." placeholder="Write any special requests here..."></textarea>
      </div>

      <div class="summary-row total">
        <span data-en="Total" data-ar="الإجمالي">Total</span>
        <span id="cartTotal">0 EGP</span>
      </div>

      <button class="btn-gold" id="confirmOrderBtn" style="width:100%; justify-content:center; margin-top:1.5rem" onclick="submitOrder()" data-en="Confirm Order ✦" data-ar="تأكيد الطلب ✦">Confirm Order ✦</button>
    </div>
  </div>
</div>

<!-- QR CONFIRMATION MODAL -->
<div class="modal-overlay" id="qrModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); justify-content:center; align-items:center; z-index:9999; padding:1.5rem;">
  <div class="modal-panel" style="max-width:400px; width:100%; background:var(--bg2); border:1px solid var(--gold); border-radius:12px; padding:2rem; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,0.3); position:relative;">
    <h3 style="font-family:'Cormorant Garamond',serif; font-size:2rem; color:var(--gold); margin-bottom:1rem;" data-en="Order Placed!" data-ar="تم تسجيل طلبك!">Order Placed!</h3>
    <p style="font-size:0.9rem; color:var(--muted); margin-bottom:1.5rem;" data-en="Show this QR code to the cashier to confirm your order:" data-ar="اعرض هذا الـ QR Code على الكاشير لتأكيد وتفعيل طلبك:">Show this QR code to the cashier to confirm your order:</p>
    
    <div style="background:var(--white); padding:1rem; border-radius:8px; display:inline-block; margin-bottom:1.5rem; box-shadow:0 8px 20px rgba(0,0,0,0.15);">
      <img id="qrCodeImg" src="" alt="QR Code" style="width:200px; height:200px; display:block;"/>
    </div>
    
    <div style="font-size:0.85rem; color:var(--text); margin-bottom:1.5rem; font-family:'Tajawal',sans-serif;">
      <span data-en="Order ID:" data-ar="رقم الطلب:">Order ID:</span> <strong id="qrOrderId" style="color:var(--gold)">#--</strong>
    </div>
    
    <button class="btn-gold" style="width:100%; justify-content:center;" onclick="closeQrModal()" data-en="Done" data-ar="تم">Done</button>
  </div>
</div>

<script>
  const user  = JSON.parse(localStorage.getItem('ozel_user') || 'null');
  function getAuthH() {
    const t = localStorage.getItem('ozel_token');
    return t ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + t } : { 'Content-Type': 'application/json' };
  }
  
  const urlParams  = new URLSearchParams(window.location.search);
  const tableParam = urlParams.get('table');

  let cart = JSON.parse(localStorage.getItem('ozel_cart') || '[]');

  const transMap = {
    'Normal': { en: 'Normal Sugar', ar: 'سكر طبيعي' },
    'Medium': { en: 'Medium Sugar', ar: 'سكر وسط' },
    'Less': { en: 'Less Sugar', ar: 'سكر خفيف' },
    'No Sugar': { en: 'No Sugar', ar: 'بدون سكر' },
    'None': { en: 'No Extras', ar: 'بدون إضافات' },
    'Extra Shot': { en: 'Extra Espresso Shot', ar: 'جرعة إسبريسو إضافية' },
    'Espresso Shot': { en: 'Extra Espresso Shot', ar: 'جرعة إسبريسو إضافية' },
    'Almond Milk': { en: 'Almond Milk', ar: 'حليب اللوز' },
    'Caramel Sauce': { en: 'Caramel Sauce', ar: 'صوص كراميل' },
    'Caramel Syrup': { en: 'Caramel Syrup', ar: 'شراب كراميل' },
    'Vanilla Syrup': { en: 'Vanilla Syrup', ar: 'شراب فانيليا' },
    'Boba Bubbles': { en: 'Boba Bubbles', ar: 'حبيبات البوبا' },
    'Ice Cream': { en: 'Ice Cream', ar: 'آيس كريم' },
    'Marshmallow': { en: 'Marshmallows', ar: 'مارشميلو' },
    'Nuts': { en: 'Nuts mix', ar: 'مكسرات مشكلة' },
    'Shot': { en: 'Extra Shot', ar: 'جرعة إضافية' },
    'Vanilla': { en: 'Vanilla Syrup', ar: 'فانيليا' },
    'Caramel': { en: 'Caramel Syrup', ar: 'كراميل' }
  };

  let currentLang = localStorage.getItem('ozel_lang') || 'en';
  let _submittingOrder = false;

  function toggleLanguage() {
    currentLang = currentLang === 'en' ? 'ar' : 'en';
    localStorage.setItem('ozel_lang', currentLang);
    applyLanguage(currentLang);
  }

  function applyLanguage(lang) {
    const isAr = lang === 'ar';
    document.documentElement.lang = lang;
    document.documentElement.dir = isAr ? 'rtl' : 'ltr';
    document.body.style.direction = isAr ? 'rtl' : 'ltr';
    
    document.querySelectorAll('[data-en]').forEach(el => {
      el.textContent = isAr ? el.getAttribute('data-ar') : el.getAttribute('data-en');
    });
    
    document.querySelectorAll('[data-placeholder-en]').forEach(el => {
      el.placeholder = isAr ? el.getAttribute('data-placeholder-ar') : el.getAttribute('data-placeholder-en');
    });
    
    loadCart();
    renderNavUser();
  }

  function renderNavUser() {
    const isAr = currentLang === 'ar';
    const area = document.getElementById('nav-user-area');
    const drawerArea = document.getElementById('drawer-user-area');
    
    let html = '';
    if (user) {
      const points = user.points || 0;
      const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
      const ptsLabel = isAr ? 'نقطة' : 'pts';
      html = `
        <div class="nav-user-logged" onclick="location.href='index.html'">
          <div class="user-avatar">${initial}</div>
          <div class="user-info-brief">
            <span class="user-name">${user.name}</span>
            <span class="user-pts" style="font-size:0.65rem; color:var(--gold); font-weight:700;">${points} ${ptsLabel}</span>
          </div>
        </div>
      `;
    } else {
      const loginText = isAr ? 'تسجيل الدخول' : 'Login';
      html = `
        <a href="login.html" class="nav-user-btn">
          <span>${loginText}</span>
        </a>
      `;
    }

    if (area) area.innerHTML = html;
    if (drawerArea) drawerArea.innerHTML = html;
  }

  window.handleTakeawayToggle = function(el) {
    const tableField = document.getElementById('tableNum');
    const phoneGroup = document.getElementById('takeawayPhoneGroup');
    const phoneInput = document.getElementById('takeawayPhone');
    if (el.checked) {
      tableField.disabled = true;
      tableField.value = '';
      phoneGroup.style.display = user ? 'none' : 'block';
    } else {
      tableField.disabled = false;
      phoneGroup.style.display = 'none';
      phoneInput.value = '';
    }
  }

  window.toggleMobileMenu = function() {
    const drawer = document.getElementById('mobileDrawer');
    const hamburger = document.getElementById('navHamburger');
    if (drawer) {
      drawer.classList.toggle('open');
    }
    if (hamburger) {
      hamburger.classList.toggle('active');
    }
  };

  function loadCart() {
    const list = document.getElementById('cartItemsList');
    const totalEl = document.getElementById('cartTotal');
    const emptyMsg = document.getElementById('emptyCartMsg');
    const contentArea = document.getElementById('cartContentArea');

    if (cart.length === 0) {
      emptyMsg.style.display = 'block';
      contentArea.style.display = 'none';
      return;
    }

    emptyMsg.style.display = 'none';
    contentArea.style.display = 'block';

    const isAr = currentLang === 'ar';
    const sugarLabel = isAr ? 'السكر' : 'Sugar';
    const extraLabel = isAr ? 'الإضافات' : 'Extras';
    const notesLabel = isAr ? 'ملاحظات' : 'Notes';
    const currencyLabel = isAr ? 'ج.م' : 'EGP';

    let sum = 0;
    list.innerHTML = '';
    
    cart.forEach((item, idx) => {
      const qty = item.quantity || 1;
      const lineTotal = item.price * qty;
      sum += lineTotal;
      const displayName = isAr ? (item.name_ar || item.name) : item.name;
      const sugarTrans = transMap[item.sugar] ? transMap[item.sugar][currentLang] : item.sugar;
      const extraTrans = transMap[item.extra] ? transMap[item.extra][currentLang] : item.extra;
      const notesStr = item.notes ? ` · ${notesLabel}: ${item.notes}` : '';

      const el = document.createElement('div');
      el.className = 'cart-item-row';
      el.innerHTML = `
        <div class="ci-details">
          <h4>${displayName} <span class="ci-qty" style="color:var(--gold);font-size:.8rem">×${qty}</span></h4>
          <p>${sugarLabel}: ${sugarTrans} · ${extraLabel}: ${extraTrans}${notesStr}</p>
        </div>
        <div style="display:flex; align-items:center;">
          <div class="ci-price">${lineTotal} ${currencyLabel}</div>
          <button class="ci-remove-btn" onclick="removeFromCart(${idx})">✕</button>
        </div>
      `;
      list.appendChild(el);
    });

    totalEl.textContent = `${sum} ${currencyLabel}`;
    
    if (tableParam) {
      document.getElementById('tableNum').value = tableParam;
    }
  }

  function removeFromCart(idx) {
    cart.splice(idx, 1);
    localStorage.setItem('ozel_cart', JSON.stringify(cart));
    loadCart();
  }

  async function submitOrder() {
    if (_submittingOrder) return;
    _submittingOrder = true;
    const isAr = currentLang === 'ar';
    const btn = document.getElementById('confirmOrderBtn');
    const origText = btn.textContent;
    btn.textContent = isAr ? 'جاري الإرسال...' : 'Submitting...';
    btn.disabled = true;
    if (cart.length === 0) {
      _submittingOrder = false;
      btn.textContent = origText;
      btn.disabled = false;
      return alert(isAr ? 'السلة فارغة!' : 'Cart is empty!');
    }
    
    const isTakeaway = document.getElementById('isTakeaway').checked;
    const tableNum = document.getElementById('tableNum').value;
    const notes = document.getElementById('orderNotes').value.trim();
    
    if (!isTakeaway && !tableNum) {
      _submittingOrder = false;
      btn.textContent = origText;
      btn.disabled = false;
      return alert(isAr ? 'يرجى إدخال رقم الطاولة أو اختيار طلب سفري' : 'Please enter table number or select takeaway');
    }

    if (isTakeaway) {
      const phone = document.getElementById('takeawayPhone').value.trim();
      if (!user && !phone) {
        _submittingOrder = false;
        btn.textContent = origText;
        btn.disabled = false;
        return alert(isAr ? 'يرجى إدخال رقم هاتفك للتواصل أو تسجيل الدخول' : 'Please enter your phone number for contact, or login');
      }
      if (phone && !/^[\d\+\(\)\-\s]{8,15}$/.test(phone)) {
        _submittingOrder = false;
        btn.textContent = origText;
        btn.disabled = false;
        return alert(isAr ? 'يرجى إدخال رقم هاتف صحيح' : 'Please enter a valid phone number');
      }
    }

    const total_price = cart.reduce((s, i) => s + i.price * (i.quantity || 1), 0);

    const orderData = {
      table_number: isTakeaway ? 'Takeaway' : String(parseInt(tableNum)),
      items: cart,
      total_price,
      notes,
      customer_phone: isTakeaway ? document.getElementById('takeawayPhone').value.trim() : undefined
    };

    try {
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: getAuthH(),
        body: JSON.stringify(orderData)
      });
      const data = await res.json();
      
      if (data.success) {
        document.getElementById('qrCodeImg').src = data.qrCodeUrl;
        document.getElementById('qrOrderId').textContent = `#${data.order_id}`;
        document.getElementById('qrModal').style.display = 'flex';
        cart = [];
        localStorage.removeItem('ozel_cart');
        loadCart();
        _submittingOrder = false;
        btn.textContent = origText;
        btn.disabled = false;
      } else {
        alert(data.error || (isAr ? 'فشل إرسال الطلب' : 'Failed to send order'));
        _submittingOrder = false;
        btn.textContent = origText;
        btn.disabled = false;
      }
    } catch (e) {
      console.error('[Cart] submitOrder error:', e);
      alert(isAr ? 'فشل الاتصال بالخادم' : 'Connection error with server');
      _submittingOrder = false;
      btn.textContent = origText;
      btn.disabled = false;
    }
  }

  function closeQrModal() {
    location.href = 'index.html';
  }

  // Initial Load
  applyLanguage(currentLang);
</script>

</body>
</html>
