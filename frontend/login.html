<!DOCTYPE html>
<!-- ===== 2M CAFE — صفحة تسجيل الدخول والتسجيل ===== -->
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<script src="api-override.js?v=3"></script>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<!-- عنوان الصفحة -->
<title>تسجيل الدخول — 2M CAFE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Tajawal:wght@300;400;500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --gold:          #d97706;
  --gold2:         #b45309;
  --gold-glow:     rgba(217, 119, 6, 0.16);
  --burgundy:      #d97706;
  --burgundy2:     #b45309;
  --burgundy-glow: rgba(217, 119, 6, 0.16);
  --bg:            #f8fafc;
  --bg2:           #ffffff;
  --bg3:           #f1f5f9;
  --bg4:           #e2e8f0;
  --line:          #e2e8f0;
  --text:          #0f172a;
  --muted:         #64748b;
  --white:         #ffffff;
  --green:         #16a34a;
  --red:           #dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Tajawal',sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:ltr;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(197, 139, 53, 0.1) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 50%, rgba(184, 123, 40, 0.08) 0%, transparent 60%);
  z-index: 0;
}
.wrap{position:relative;z-index:2;width:100%;max-width:440px;padding:1.5rem;}

/* Header */
.header{
  text-align:center;
  margin-bottom:2rem;
}
.header .logo-img{
  width:130px;
  height:auto;
  margin:0 auto 1rem;
  display:block;
  opacity:.92;
}
.header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:2rem;
  font-weight:300;
  color:var(--burgundy);
  letter-spacing:.35em;
  margin-bottom:.25rem;
}
.header p{
  font-size:.75rem;
  color:var(--muted);
  letter-spacing:.35em;
  text-transform:uppercase;
}

/* Card */
.card{
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:2rem 2.25rem 2.25rem;
  box-shadow:0 8px 40px rgba(36,30,26,.06);
}

/* Tabs */
.tabs{
  display:flex;
  gap:0;
  margin-bottom:1.75rem;
  background:var(--bg3);
  border-radius:8px;
  padding:3px;
}
.tab{
  flex:1;
  background:none;
  border:none;
  color:var(--muted);
  padding:.6rem;
  font-family:'Tajawal',sans-serif;
  font-size:.85rem;
  cursor:pointer;
  transition:all .25s;
  border-radius:6px;
  font-weight:500;
}
.tab.active{
  background:var(--bg2);
  color:var(--burgundy);
  font-weight:700;
  box-shadow:0 1px 4px rgba(0,0,0,.06);
}

/* Forms */
.page{display:none;}
.page.active{display:block;}

.field{margin-bottom:1.1rem;}
.field label{
  display:block;
  font-size:.72rem;
  color:var(--muted);
  letter-spacing:.1em;
  text-transform:uppercase;
  margin-bottom:.35rem;
  font-weight:500;
}
.field input, .field select{
  width:100%;
  background:var(--bg3);
  border:1.5px solid var(--line);
  color:var(--text);
  padding:.8rem 1rem;
  font-family:'Tajawal',sans-serif;
  font-size:.9rem;
  outline:none;
  border-radius:8px;
  transition:all .2s;
}
.field input:focus, .field select:focus{
  border-color:var(--burgundy);
  background:var(--bg2);
  box-shadow:0 0 0 3px var(--burgundy-glow);
}
.field input::placeholder{color:#8c7e6c;font-size:.85rem;}

.btn{
  width:100%;
  background:var(--burgundy);
  color:var(--white);
  border:none;
  padding:.9rem;
  font-family:'Tajawal',sans-serif;
  font-size:.95rem;
  font-weight:700;
  cursor:pointer;
  border-radius:8px;
  transition:all .25s;
  letter-spacing:.05em;
  margin-top:.5rem;
}
.btn:hover:not(:disabled){background:var(--burgundy2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.err{
  font-size:.78rem;
  color:var(--red);
  margin-top:.6rem;
  min-height:1.2em;
  text-align:center;
}
.err.success{color:var(--green);}

.links{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:1rem;
}
.links a, .links span{
  font-size:.75rem;
  color:var(--muted);
  cursor:pointer;
  transition:color .2s;
  text-decoration:none;
}
.links a:hover, .links span:hover{color:var(--burgundy);}

.skip{
  display:block;
  text-align:center;
  margin-top:1.5rem;
  font-size:.75rem;
  color:var(--muted);
  cursor:pointer;
  transition:color .2s;
  text-decoration:none;
}
.skip:hover{color:var(--burgundy);}

/* Lang Toggle */
.lang-toggle{
  position:fixed;
  top:1.25rem;
  right:1.25rem;
  z-index:10;
  background:var(--bg2);
  border:1px solid var(--line);
  border-radius:6px;
  padding:.35rem .65rem;
  font-family:'Tajawal',sans-serif;
  font-size:.75rem;
  color:var(--muted);
  cursor:pointer;
  transition:all .2s;
  letter-spacing:.05em;
}
.lang-toggle:hover{
  border-color:var(--burgundy);
  color:var(--burgundy);
}

/* Password wrapper */
.pw-wrap{position:relative;}
.pw-toggle{
  position:absolute;
  right:12px;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:.8rem;
  padding:2px;
  line-height:1;
}
.pw-toggle:hover{color:var(--burgundy);}

/* ===== تنسيقات متجاوبة مع الشاشات الصغيرة ===== */
@media(max-width:480px){
  .wrap{padding:1rem;}
  .card{padding:1.5rem;}
  .header h1{font-size:1.6rem;}
  .header .logo-img{width:100px;}
}
</style>

<style id="2m-light-palette">
:root {
  --gold: #bd923f; --gold2: #966b22; --gold-glow: rgba(189,146,63,.17);
  --burgundy: #bd923f; --burgundy2: #a87925; --burgundy-glow: rgba(189,146,63,.15);
  --bg: #fffdf8; --bg2: #ffffff; --bg3: #f7f1e4; --bg4: #ede2c9;
  --line: #eadfc8; --text: #30291d; --text-secondary: #625844; --muted: #887e6b;
  --white: #ffffff; --green: #2f8058;
}
body { background-color: var(--bg); color: var(--text); }
</style>
</head>
<body>

<!-- ===== زر تبديل اللغة (ثابت في الأعلى) ===== -->
<div class="lang-toggle" id="langBtn" onclick="toggleLanguage()">EN / AR</div>

<!-- ===== الحاوية الرئيسية للصفحة ===== -->
<div class="wrap">

  <!-- ===== رأس الصفحة والشعار ===== -->
  <div class="header">
    <img src="imgs/2m-logo.png" alt="2M CAFE" class="logo-img"/>
    <h1 style="color:var(--gold); font-weight:800; letter-spacing:0.15em;">2M CAFE</h1>
    <p data-en="Luxury Coffee Experience" data-ar="تجربة استثنائية راقية">Luxury Coffee Experience</p>
  </div>

  <!-- ===== بطاقة تسجيل الدخول/التسجيل ===== -->
  <div class="card">

    <!-- ===== علامات التبويب (تسجيل دخول / تسجيل جديد) ===== -->
    <div class="tabs" id="tabGroup">
      <button class="tab active" data-tab="login" data-en="Login" data-ar="تسجيل الدخول">Login</button>
      <button class="tab" data-tab="register" data-en="Register" data-ar="تسجيل جديد">Register</button>
    </div>

    <!-- ===== نموذج تسجيل الدخول ===== -->
    <div class="page active" id="page-login">
      <div class="field">
        <label data-en="Phone or Email" data-ar="رقم الهاتف أو البريد">Phone or Email</label>
        <input id="l-id" type="text" data-placeholder-en="Phone number or email" data-placeholder-ar="رقم الهاتف أو البريد الإلكتروني" placeholder="Phone number or email" autocomplete="username"/>
      </div>
      <div class="field">
        <label data-en="Password" data-ar="كلمة المرور">Password</label>
        <div class="pw-wrap">
          <input id="l-pass" type="password" data-placeholder-en="Enter your password" data-placeholder-ar="أدخل كلمة المرور" placeholder="Enter your password" autocomplete="current-password"/>
          <button class="pw-toggle" type="button" onclick="togglePw('l-pass')" tabindex="-1">&#128065;</button>
        </div>
      </div>
      <button id="l-btn" class="btn" data-en="Login" data-ar="تسجيل الدخول">Login</button>
      <p class="err" id="l-err"></p>
      <div class="links">
        <span id="forgotLink" data-en="Forgot Password?" data-ar="نسيت كلمة المرور؟">Forgot Password?</span>
      </div>
    </div>

    <!-- ===== نموذج التسجيل الجديد ===== -->
    <div class="page" id="page-register">
      <div class="field">
        <label data-en="Name" data-ar="الاسم">Name</label>
        <input id="r-name" type="text" data-placeholder-en="Your full name" data-placeholder-ar="الاسم الكريم" placeholder="Your full name" autocomplete="name"/>
      </div>
      <div class="field">
        <label data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label>
        <input id="r-phone" type="tel" data-placeholder-en="01xxxxxxxxx" data-placeholder-ar="٠١xxxxxxxxx" placeholder="01xxxxxxxxx" autocomplete="tel"/>
      </div>
      <div class="field">
        <label data-en="Email (optional)" data-ar="البريد الإلكتروني (اختياري)">Email (optional)</label>
        <input id="r-email" type="email" data-placeholder-en="example@mail.com" data-placeholder-ar="example@mail.com" placeholder="example@mail.com" autocomplete="email"/>
      </div>

      <div class="field">
        <label data-en="Password" data-ar="كلمة المرور">Password</label>
        <div class="pw-wrap">
          <input id="r-pass" type="password" data-placeholder-en="Choose a strong password" data-placeholder-ar="اختر كلمة مرور قوية" placeholder="Choose a strong password" autocomplete="new-password"/>
          <button class="pw-toggle" type="button" onclick="togglePw('r-pass')" tabindex="-1">&#128065;</button>
        </div>
      </div>
      <button id="r-btn" class="btn" data-en="Create Account" data-ar="إنشاء حساب">Create Account</button>
      <p class="err" id="r-err"></p>
    </div>
  </div>

  <!-- ===== رابط تخطي تسجيل الدخول ===== -->
  <span class="skip" id="skipLink" data-en="Skip &mdash; browse the menu" data-ar="تخطي &mdash; تصفح المنيو">Skip — browse the menu</span>
</div>

<!-- ===== بداية كود JavaScript الخاص بالصفحة ===== -->
<script>
// ===== 2M CAFE — منطق تسجيل الدخول والتسجيل =====

// رابط إعادة التوجيه بعد تسجيل الدخول
const redirect = new URLSearchParams(location.search).get('from') || 'index.html';
let currentLang = (localStorage.getItem('2m_lang') || localStorage.getItem('ozel_lang')) || 'en';

// ===== التبديل بين علامات تبويب تسجيل الدخول والتسجيل =====
function switchTab(t){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab')===t));
  document.getElementById('page-login').classList.toggle('active',t==='login');
  document.getElementById('page-register').classList.toggle('active',t==='register');
  const le=document.getElementById('l-err');if(le)le.textContent='';
  const re=document.getElementById('r-err');if(re)re.textContent='';
}

// ===== إظهار/إخفاء كلمة المرور =====
function togglePw(id){
  const inp = document.getElementById(id);
  if(!inp)return;
  const wrap = inp.closest('.pw-wrap');
  if(!wrap)return;
  const btn = wrap.querySelector('.pw-toggle');
  if(!btn)return;
  if(inp.type==='password'){inp.type='text';btn.textContent='\u{1F648}';}
  else{inp.type='password';btn.textContent='\u{1F441}';}
}

// ===== ترجمة رسائل الخطأ من الخادم إلى العربية =====
function translateError(msg){
  if(!msg) return currentLang==='ar'?'حدث خطأ غير متوقع':'Unexpected error';
  console.error('[API Error]', msg);
  const a=currentLang==='ar';
  if(msg==='Invalid credentials') return a?'رقم الهاتف أو كلمة المرور غير صحيحة':'Incorrect phone number or password';
  if(msg==='Phone already registered') return a?'رقم الهاتف مسجل بالفعل':'Phone number already registered';
  if(msg==='Email already registered') return a?'البريد الإلكتروني مسجل بالفعل':'Email already registered';
  if(msg==='All fields required'||msg==='Name, password, and at least a Phone number or Email are required') return a?'يرجى إكمال جميع الحقول المطلوبة':'Please complete all required fields';
  if(msg==='Database connection failed'||msg.includes('MongoDB')||msg.includes('database')||msg.includes('ECONNREFUSED')) return a?'فشل الاتصال بقاعدة البيانات، يرجى المحاولة لاحقاً':'Database connection failed, please try again later';
  if(msg.includes('validation failed')||msg.includes('required')) return a?'يرجى التأكد من صحة البيانات المدخلة':'Please check your input data';
  if(msg.includes('E11000')||msg.includes('duplicate')) return a?'رقم الهاتف أو البريد موجود بالفعل':'Phone or email already exists';
  return a? msg : msg;
}

let loginAbortController = null;
let registerAbortController = null;

// ===== تنفيذ عملية تسجيل الدخول =====
async function doLogin(){
  const a=currentLang==='ar';
  const btn=document.getElementById('l-btn');
  const err=document.getElementById('l-err');
  err.textContent=''; err.className='err';
  const id=document.getElementById('l-id').value.trim();
  const pw=document.getElementById('l-pass').value;
  if(!id||!pw){err.textContent=a?'يرجى إدخال الهاتف/البريد وكلمة المرور':'Please enter identifier and password';return;}
  
  if (loginAbortController) {
    loginAbortController.abort();
  }
  loginAbortController = new AbortController();

  btn.disabled=true; btn.textContent=a?'جارٍ تسجيل الدخول...':'Logging in...';
  try{
    const r=await fetch('/api/auth/login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({identifier:id,password:pw}),
      signal: loginAbortController.signal
    });
    const d=await r.json();
    if(!r.ok){console.error('[Login 500]', d);err.textContent=translateError(d.error||d.message);btn.disabled=false;btn.textContent=a?'تسجيل الدخول':'Login';return;}
    if(!d.token||!d.user){err.textContent=a?'استجابة غير صالحة':'Invalid response';btn.disabled=false;btn.textContent=a?'تسجيل الدخول':'Login';return;}
    localStorage.setItem('2m_token',d.token); localStorage.setItem('ozel_token',d.token);
    localStorage.setItem('2m_user',JSON.stringify(d.user)); localStorage.setItem('ozel_user',JSON.stringify(d.user));
    if(d.user.role==='admin') location.href='admin.html';
    else if(d.user.role==='cashier') location.href='cashier.html';
    else location.href=redirect;
  }catch(e){
    if (e.name === 'AbortError') return;
    err.textContent=a?'فشل الاتصال بالخادم':'Connection failed';
    btn.disabled=false;btn.textContent=a?'تسجيل الدخول':'Login';
  } finally {
    loginAbortController = null;
  }
}

// ===== تنفيذ عملية إنشاء حساب جديد =====
async function doRegister(){
  const a=currentLang==='ar';
  const btn=document.getElementById('r-btn');
  const err=document.getElementById('r-err');
  err.textContent=''; err.className='err';
  const name=document.getElementById('r-name').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const email=document.getElementById('r-email').value.trim();
  const pw=document.getElementById('r-pass').value;
  if(!name||!pw||(!phone&&!email)){err.textContent=a?'يرجى إكمال الاسم وكلمة المرور والهاتف أو البريد':'Please fill name, password, and phone or email';return;}

  if (registerAbortController) {
    registerAbortController.abort();
  }
  registerAbortController = new AbortController();

  btn.disabled=true; btn.textContent=a?'جارٍ إنشاء الحساب...':'Creating...';
  try{
    const r=await fetch('/api/auth/register',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,phone,email:email||undefined,password:pw}),
      signal: registerAbortController.signal
    });
    const d=await r.json();
    if(!r.ok){err.textContent=translateError(d.error||d.message);btn.disabled=false;btn.textContent=a?'إنشاء حساب':'Create Account';return;}
    if(!d.token||!d.user){err.textContent=a?'استجابة غير صالحة':'Invalid response';btn.disabled=false;btn.textContent=a?'إنشاء حساب':'Create Account';return;}
    localStorage.setItem('2m_token',d.token); localStorage.setItem('ozel_token',d.token);
    localStorage.setItem('2m_user',JSON.stringify(d.user)); localStorage.setItem('ozel_user',JSON.stringify(d.user));
    err.className='err success';
    err.textContent=a?'تم إنشاء الحساب بنجاح! جاري التوجيه...':'Account created! Redirecting...';
    setTimeout(()=>{location.href=redirect;},800);
  }catch(e){
    if (e.name === 'AbortError') return;
    err.textContent=a?'فشل الاتصال بالخادم':'Connection failed';
    btn.disabled=false;btn.textContent=a?'إنشاء حساب':'Create Account';
  } finally {
    registerAbortController = null;
  }
}

// ===== معالجة طلب استعادة كلمة المرور =====
function forgotPassword(){
  alert(currentLang==='ar'?'لاستعادة كلمة المرور، يرجى مراجعة الكاشير في الكافيه.':'To reset your password, please see the cashier at the cafe.');
}

// ===== تخطي تسجيل الدخول والذهاب للقائمة =====
function skipLogin(){location.href=redirect;}

// ===== تبديل اللغة بين العربية والإنجليزية =====
function toggleLanguage(){
  currentLang=currentLang==='en'?'ar':'en';
  localStorage.setItem('2m_lang',currentLang); localStorage.setItem('ozel_lang',currentLang);
  applyLanguage(currentLang);
}

// ===== تطبيق اللغة على جميع عناصر الصفحة =====
function applyLanguage(lang){
  const a=lang==='ar';
  document.documentElement.lang=lang;
  document.documentElement.dir=a?'rtl':'ltr';
  document.querySelectorAll('[data-en]').forEach(el=>{el.innerHTML=a?el.getAttribute('data-ar'):el.getAttribute('data-en');});
  document.querySelectorAll('[data-placeholder-en]').forEach(el=>{el.placeholder=a?el.getAttribute('data-placeholder-ar'):el.getAttribute('data-placeholder-en');});
}

// ===== ربط جميع أحداث النقر عبر addEventListener (أكثر أماناً) =====
document.querySelectorAll('.tab').forEach(el => {
  el.addEventListener('click', function(){switchTab(this.getAttribute('data-tab'));});
});
document.getElementById('l-btn').addEventListener('click', doLogin);
document.getElementById('r-btn').addEventListener('click', doRegister);
document.getElementById('forgotLink').addEventListener('click', forgotPassword);
document.getElementById('skipLink').addEventListener('click', skipLogin);

// ===== إعادة التوجيه التلقائي إذا كان رمز الدخول لا يزال صالحاً =====
(async function(){
  const u=JSON.parse((localStorage.getItem('2m_user') || localStorage.getItem('ozel_user'))||'null');
  const t=(localStorage.getItem('2m_token') || localStorage.getItem('ozel_token'));
  if(u&&t){
    try{
      const c=await fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+t}});
      if(c.ok){
        if(u.role==='admin') location.href='admin.html';
        else if(u.role==='cashier') location.href='cashier.html';
        else location.href=redirect;
        return;
      }
    }catch(e){}
    localStorage.removeItem('2m_token'); localStorage.removeItem('ozel_token');
    localStorage.removeItem('2m_user'); localStorage.removeItem('ozel_user');
  }
})();

applyLanguage(currentLang);
</script>
</body>
