<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — OZEL CAFE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Tajawal:wght@300;400;500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root {
  --burgundy:      #541a1a;
  --burgundy2:     #702424;
  --burgundy-glow: rgba(84, 26, 26, 0.08);
  --accent-emerald:       #5c766d;
  --accent-emerald-light: #759288;
  --accent-emerald-glow:  rgba(92, 118, 109, 0.08);
  --gold:          #541a1a;
  --gold2:         #702424;
  --gold-glow:     rgba(84, 26, 26, 0.12);
  --bg:            #FDFBF7;
  --bg2:           #FFFFFF;
  --bg3:           #F5F2EC;
  --bg4:           #EAE5DA;
  --line:          rgba(92, 118, 109, 0.16);
  --text:          #241E1A;
  --muted:         rgba(36, 30, 26, 0.65);
  --white:         #ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);direction:ltr;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg-img{display:none;}
.grain{position:fixed;inset:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;z-index:1;}
.wrap{position:relative;z-index:2;width:100%;max-width:460px;padding:1.5rem;}

.logo{text-align:center;margin-bottom:2.5rem;}
.login-logo-img{width:160px;height:auto;margin:0 auto 1rem;display:block;animation:pulseLogo 2s infinite ease-in-out;}
.logo-en{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--gold);letter-spacing:.4em;display:block;}
.logo-tag{font-size:.65rem;letter-spacing:.5em;color:var(--muted);text-transform:uppercase;margin-top:.3rem;}
@keyframes pulseLogo {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.05); opacity: 1; }
}

.card{background:var(--bg2);border:1px solid var(--line);box-shadow: 0 10px 30px rgba(36, 30, 26, 0.05);padding:2.5rem;border-radius:8px;}
.tabs{display:flex;gap:0;margin-bottom:2rem;border-bottom:1px solid var(--line);}
.tab{flex:1;background:none;border:none;color:var(--muted);padding:.8rem;font-family:'Tajawal',sans-serif;font-size:.95rem;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700;}
.form-section{display:none;}
.form-section.active{display:block;}
.field{margin-bottom:1.2rem;}
.field label{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:.5rem;font-family:'Montserrat',sans-serif;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--text);padding:.85rem 1rem;font-family:'Tajawal',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;border-radius:4px;}
.field input:focus{border-color:var(--gold);}
.btn{width:100%;background:var(--gold);color:var(--white);border:none;padding:.9rem;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:.5rem;letter-spacing:.05em;border-radius:4px;}
.btn:hover{background:var(--gold2);}
.err{color:#C0392B;font-size:.85rem;margin-top:.8rem;text-align:center;}
.ok{color:#27AE60;font-size:.85rem;margin-top:.8rem;text-align:center;}
.skip{display:block;text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.85rem;cursor:pointer;transition:color .2s;}
.skip:hover{color:var(--gold);}
.skip a{color:var(--gold);text-decoration:none;}
/* ── LANGUAGE SWITCH (Premium Floating Pill) ── */
.lang-switch-wrapper {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  cursor: pointer;
  padding: 0.35rem 0.7rem;
  border-radius: 40px;
  background: rgba(255, 255, 255, 0.45);
  border: 1px solid rgba(194, 159, 67, 0.18);
  box-shadow: 
    0 4px 15px rgba(36, 30, 26, 0.02),
    inset 0 1px 3px rgba(255, 255, 255, 0.6);
  transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
  user-select: none;
  direction: ltr; /* Always layout LTR */
}
.lang-switch-wrapper:hover {
  background: rgba(255, 255, 255, 0.9);
  border-color: rgba(194, 159, 67, 0.4);
  box-shadow: 
    0 6px 20px rgba(194, 159, 67, 0.08),
    inset 0 1px 3px rgba(255, 255, 255, 0.8);
  transform: translateY(-1px);
}
.lang-switch-text {
  font-family: 'Outfit', sans-serif;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--muted);
  transition: color 0.3s ease;
  letter-spacing: 0.05em;
}
.lang-switch-text.ar-text {
  font-family: 'Tajawal', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
}
.lang-switch-pill {
  position: relative;
  width: 36px;
  height: 20px;
  background: rgba(92, 118, 109, 0.15);
  border-radius: 20px;
  transition: background 0.3s ease;
  box-shadow: inset 0 1px 3px rgba(0,0,0,0.06);
}
.lang-switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  background: linear-gradient(135deg, #c2a04a, #e8d5a0);
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(194, 159, 67, 0.35);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
body[dir="rtl"] .lang-switch-thumb {
  transform: translateX(16px);
}
body[dir="rtl"] .lang-switch-wrapper .ar-text {
  color: #a07830;
}
body[dir="ltr"] .lang-switch-wrapper .en-text {
  color: #a07830;
}
</style>
</head>
<body>
<div class="bg-img"></div>
<div class="grain"></div>
<div class="wrap">
  <div style="display:flex; justify-content:flex-end; margin-bottom:1rem;">
    <div class="lang-switch-wrapper" onclick="toggleLanguage()" id="langToggleSwitch">
      <span class="lang-switch-text en-text">EN</span>
      <div class="lang-switch-pill">
        <div class="lang-switch-thumb"></div>
      </div>
      <span class="lang-switch-text ar-text">ع</span>
    </div>
  </div>
  <div class="logo">
    <img src="imgs/Ozel-Logo--02.png" alt="OZEL Logo" class="login-logo-img" />
    <span class="logo-en">OZEL</span>
    <span class="logo-tag" data-en="Hidden Gem Café" data-ar="الجوهرة المخفية">Hidden Gem Café</span>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')" data-en="Login" data-ar="تسجيل الدخول">Login</button>
      <button class="tab" onclick="switchTab('register')" data-en="Register" data-ar="تسجيل حساب">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="tab-login">
      <div class="field"><label data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label><input id="l-phone" type="tel" data-placeholder-en="01xxxxxxxxx" data-placeholder-ar="٠١xxxxxxxxx" placeholder="01xxxxxxxxx"/></div>
      <div class="field"><label data-en="Password" data-ar="كلمة المرور">Password</label><input id="l-pass" type="password" data-placeholder-en="••••••••" data-placeholder-ar="••••••••" placeholder="••••••••"/></div>
      <button class="btn" onclick="doLogin()" data-en="Login" data-ar="تسجيل الدخول">Login</button>
      <span class="skip" style="margin-top:0.8rem; font-size:0.75rem;" onclick="forgotPassword()" data-en="Forgot Password?" data-ar="نسيت كلمة المرور؟">Forgot Password?</span>
      <p class="err" id="l-err"></p>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="tab-register">
      <div class="field"><label data-en="Name" data-ar="الاسم">Name</label><input id="r-name" type="text" data-placeholder-en="Your Name" data-placeholder-ar="الاسم الكريم" placeholder="Your Name"/></div>
      <div class="field"><label data-en="Phone Number" data-ar="رقم الهاتف">Phone Number</label><input id="r-phone" type="tel" data-placeholder-en="01xxxxxxxxx" data-placeholder-ar="٠١xxxxxxxxx" placeholder="01xxxxxxxxx"/></div>
      <div class="field"><label data-en="Password" data-ar="كلمة المرور">Password</label><input id="r-pass" type="password" data-placeholder-en="Choose a password" data-placeholder-ar="اختر كلمة مرور" placeholder="Choose a password"/></div>
      <button class="btn" onclick="doRegister()" data-en="Create Account" data-ar="إنشاء حساب">Create Account</button>
      <p class="err" id="r-err"></p>
    </div>
  </div>
  <span class="skip" onclick="skipLogin()" data-en="Skip and browse menu without login" data-ar="تخطى وتصفح المنيو بدون تسجيل الدخول">Skip and browse menu without login</span>
</div>
<script>
const redirect = new URLSearchParams(location.search).get('from') || '/';
let currentLang = localStorage.getItem('ozel_lang') || 'en';

function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===(t==='login'?0:1)));
  document.getElementById('tab-login').classList.toggle('active',t==='login');
  document.getElementById('tab-register').classList.toggle('active',t==='register');
}

function translateError(msg) {
  const isAr = currentLang === 'ar';
  if (msg === 'Invalid credentials') return isAr ? 'رقم الهاتف أو كلمة المرور غير صحيحة' : 'Incorrect phone number or password';
  if (msg === 'User not found') return isAr ? 'الحساب غير موجود' : 'Account not found';
  if (msg === 'Phone already registered') return isAr ? 'رقم الهاتف مسجل بالفعل' : 'Phone number already registered';
  if (msg === 'All fields required') return isAr ? 'يرجى إكمال جميع الحقول' : 'Please complete all fields';
  return isAr ? 'حدث خطأ، يرجى المحاولة مرة أخرى' : 'An error occurred, please try again';
}

function forgotPassword() {
  const isAr = currentLang === 'ar';
  alert(isAr 
    ? 'لاستعادة كلمة المرور، يرجى مراجعة الكاشير في الكافيه لإعادة تعيين حسابك.' 
    : 'To restore your password, please see the cashier at the cafe to reset your account.');
}

async function doLogin(){
  const isAr = currentLang === 'ar';
  const phone=document.getElementById('l-phone').value.trim();
  const pass=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  err.textContent='';
  if(!phone || !pass) { err.textContent = isAr ? 'يرجى إدخال رقم الهاتف وكلمة المرور' : 'Please enter phone number and password'; return; }
  const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password:pass})});
  const data=await res.json();
  if(!res.ok){err.textContent=translateError(data.error);return;}
  localStorage.setItem('ozel_token',data.token);
  localStorage.setItem('ozel_user',JSON.stringify(data.user));
  if(data.user.role==='admin') location.href='/admin';
  else if(data.user.role==='cashier') location.href='/cashier';
  else location.href=redirect;
}

async function doRegister(){
  const isAr = currentLang === 'ar';
  const name=document.getElementById('r-name').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const pass=document.getElementById('r-pass').value;
  const err=document.getElementById('r-err');
  err.textContent='';
  if(!name || !phone || !pass) { err.textContent = isAr ? 'يرجى إكمال جميع الحقول' : 'Please complete all fields'; return; }
  if(phone.length < 10) { err.textContent = isAr ? 'رقم هاتف غير صالح' : 'Invalid phone number'; return; }
  const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,password:pass})});
  const data=await res.json();
  if(!res.ok){err.textContent=translateError(data.error);return;}
  localStorage.setItem('ozel_token',data.token);
  localStorage.setItem('ozel_user',JSON.stringify(data.user));
  location.href=redirect;
}

function skipLogin(){location.href=redirect;}

function toggleLanguage() {
  currentLang = currentLang === 'en' ? 'ar' : 'en';
  localStorage.setItem('ozel_lang', currentLang);
  applyLanguage(currentLang);
}

function applyLanguage(lang) {
  const isAr = lang === 'ar';
  document.documentElement.lang = lang;
  document.documentElement.dir = isAr ? 'rtl' : 'ltr';
  document.body.style.direction = isAr ? 'rtl' : 'ltr';
  
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = isAr ? el.getAttribute('data-ar') : el.getAttribute('data-en');
  });
  
  document.querySelectorAll('[data-placeholder-en]').forEach(el => {
    el.placeholder = isAr ? el.getAttribute('data-placeholder-ar') : el.getAttribute('data-placeholder-en');
  });
}

// Auto redirect if already logged in
const u=JSON.parse(localStorage.getItem('ozel_user')||'null');
if(u){
  if(u.role==='admin') location.href='/admin';
  else if(u.role==='cashier') location.href='/cashier';
  else location.href=redirect;
}

// Initial Load
applyLanguage(currentLang);
</script>
</body>
</html>
