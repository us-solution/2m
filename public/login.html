<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Login — OZEL CAFE</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Tajawal:wght@300;400;500;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet"/>
<style>
:root {
  --gold:      #b53c3c;
  --gold2:     #cc5252;
  --olive:     #0b0404;
  --bg:        #0b0404;
  --bg2:       #170c0c;
  --bg3:       #241414;
  --line:      rgba(245, 237, 233, 0.12);
  --text:      #f6efe9;
  --muted:     rgba(245, 237, 233, 0.6);
  --white:     #ffffff;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);direction:ltr;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.bg-img{display:none;}
.grain{position:fixed;inset:0;opacity:.02;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px;z-index:1;}
.wrap{position:relative;z-index:2;width:100%;max-width:460px;padding:1.5rem;}

.logo{text-align:center;margin-bottom:2.5rem;}
.login-logo-img{width:110px;height:auto;margin:0 auto 1rem;display:block;animation:pulseLogo 2s infinite ease-in-out;}
.logo-en{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--gold);letter-spacing:.4em;display:block;}
.logo-tag{font-size:.65rem;letter-spacing:.5em;color:var(--muted);text-transform:uppercase;margin-top:.3rem;}
@keyframes pulseLogo {
  0%, 100% { transform: scale(1); opacity: 0.9; }
  50% { transform: scale(1.05); opacity: 1; }
}

.card{background:var(--bg2);border:1px solid var(--line);box-shadow: 0 10px 30px rgba(0,0,0,0.05);padding:2.5rem;border-radius:8px;}
.tabs{display:flex;gap:0;margin-bottom:2rem;border-bottom:1px solid var(--line);}
.tab{flex:1;background:none;border:none;color:var(--muted);padding:.8rem;font-family:'Tajawal',sans-serif;font-size:.95rem;cursor:pointer;transition:all .2s;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);font-weight:700;}
.form-section{display:none;}
.form-section.active{display:block;}
.field{margin-bottom:1.2rem;}
.field label{display:block;font-size:.7rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;margin-bottom:.5rem;font-family:'Montserrat',sans-serif;}
.field input{width:100%;background:var(--bg3);border:1px solid var(--line);color:var(--white);padding:.85rem 1rem;font-family:'Tajawal',sans-serif;font-size:.95rem;outline:none;transition:border-color .2s;border-radius:4px;}
.field input:focus{border-color:var(--gold);}
.btn{width:100%;background:var(--gold);color:#FFFFFF;border:none;padding:.9rem;font-family:'Tajawal',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;transition:all .3s;margin-top:.5rem;letter-spacing:.05em;border-radius:4px;}
.btn:hover{background:var(--gold2);}
.err{color:#C0392B;font-size:.85rem;margin-top:.8rem;text-align:center;}
.ok{color:#27AE60;font-size:.85rem;margin-top:.8rem;text-align:center;}
.skip{display:block;text-align:center;margin-top:1.5rem;color:var(--muted);font-size:.85rem;cursor:pointer;transition:color .2s;}
.skip:hover{color:var(--gold);}
.skip a{color:var(--gold);text-decoration:none;}
</style>
</head>
<body>
<div class="bg-img"></div>
<div class="grain"></div>
<div class="wrap">
  <div class="logo">
    <img src="imgs/ozel-logo.png" alt="OZEL Logo" class="login-logo-img" />
    <span class="logo-en">OZEL</span>
    <span class="logo-tag">Hidden Gem Café</span>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="tab-login">
      <div class="field"><label>Phone Number</label><input id="l-phone" type="tel" placeholder="01xxxxxxxxx"/></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="••••••••"/></div>
      <button class="btn" onclick="doLogin()">Login</button>
      <span class="skip" style="margin-top:0.8rem; font-size:0.75rem;" onclick="forgotPassword()">Forgot Password?</span>
      <p class="err" id="l-err"></p>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="tab-register">
      <div class="field"><label>Name</label><input id="r-name" type="text" placeholder="Your Name"/></div>
      <div class="field"><label>Phone Number</label><input id="r-phone" type="tel" placeholder="01xxxxxxxxx"/></div>
      <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="Choose a password"/></div>
      <button class="btn" onclick="doRegister()">Create Account</button>
      <p class="err" id="r-err"></p>
    </div>
  </div>
  <span class="skip" onclick="skipLogin()">Skip and browse menu without login</span>
</div>
<script>
const redirect = new URLSearchParams(location.search).get('from') || '/';
function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===(t==='login'?0:1)));
  document.getElementById('tab-login').classList.toggle('active',t==='login');
  document.getElementById('tab-register').classList.toggle('active',t==='register');
}
function translateError(msg) {
  if (msg === 'Invalid credentials') return 'Incorrect phone number or password';
  if (msg === 'User not found') return 'Account not found';
  if (msg === 'Phone already registered') return 'Phone number already registered';
  if (msg === 'All fields required') return 'Please complete all fields';
  return 'An error occurred, please try again';
}

function forgotPassword() {
  alert('To restore your password, please see the cashier at the cafe to reset your account.');
}

async function doLogin(){
  const phone=document.getElementById('l-phone').value.trim();
  const pass=document.getElementById('l-pass').value;
  const err=document.getElementById('l-err');
  err.textContent='';
  if(!phone || !pass) { err.textContent = 'Please enter phone number and password'; return; }
  const res=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,password:pass})});
  const data=await res.json();
  if(!res.ok){err.textContent=translateError(data.error);return;}
  localStorage.setItem('ozel_token',data.token);
  localStorage.setItem('ozel_user',JSON.stringify(data.user));
  if(data.user.role==='admin') location.href='/admin';
  else if(data.user.role==='cashier') location.href='/cashier';
  else location.href=redirect;
}
async function doRegister(){
  const name=document.getElementById('r-name').value.trim();
  const phone=document.getElementById('r-phone').value.trim();
  const pass=document.getElementById('r-pass').value;
  const err=document.getElementById('r-err');
  err.textContent='';
  if(!name || !phone || !pass) { err.textContent = 'Please complete all fields'; return; }
  if(phone.length < 10) { err.textContent = 'Invalid phone number'; return; }
  const res=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,password:pass})});
  const data=await res.json();
  if(!res.ok){err.textContent=translateError(data.error);return;}
  localStorage.setItem('ozel_token',data.token);
  localStorage.setItem('ozel_user',JSON.stringify(data.user));
  location.href=redirect;
}
function skipLogin(){location.href=redirect;}
// Auto redirect if already logged in
const u=JSON.parse(localStorage.getItem('ozel_user')||'null');
if(u){if(u.role==='admin')location.href='/admin';else if(u.role==='cashier')location.href='/cashier';else location.href=redirect;}
</script>
</body>
</html>
